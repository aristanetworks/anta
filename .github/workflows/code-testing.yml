---
name: Testing ANTA
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  file-changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      benchmarks: ${{ steps.filter.outputs.benchmarks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'anta/**'
              - 'tests/**'
              # detect dependency changes
              - 'pyproject.toml'
            benchmarks:
              - 'tests/benchmark/**'
              - '.github/workflows/codspeed.yml'
              - '.github/workflows/code-testing.yml'
  test-python:
    name: Pytest across all supported python versions (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.11"
            tox-env: clean,py311,report
          - python: "3.12"
            tox-env: py312
          - python: "3.13"
            tox-env: py313
          - python: "3.14"
            tox-env: py314
          - python: "3.15"
            tox-env: py315
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: ${{ matrix.python == '3.15' }}
      - name: Install tox
        run: python -m pip install --group tox
      - name: "Run pytest via tox for ${{ matrix.python }}"
        run: tox run -e "${{ matrix.tox-env }}"
      - name: Upload coverage from pytest
        # Coverage only runs as part of 3.11.
        if: |
          matrix.python == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-coverage
          path: coverage.xml
  test-python-windows:
    name: Pytest on 3.12 for windows
    runs-on: windows-2022
    needs: [file-changes]
    if: needs.file-changes.outputs.code == 'true'
    env:
      # Required to prevent asyncssh to fail.
      USERNAME: WindowsUser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12
      - name: Install tox
        run: python -m pip install --group tox
      - name: Run pytest via tox for 3.12 on Windows
        run: tox run -e py312 -- --ignore=tests/docs
  test-documentation:
    name: Build offline documentation for testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[cli]" --group doc -e tools/zensical_extensions
      - name: "Build Zensical documentation offline"
        run: zensical build --strict
  benchmarks:
    name: Benchmark ANTA
    needs: [file-changes, test-python]
    if: (needs.file-changes.outputs.code == 'true' || needs.file-changes.outputs.benchmarks == 'true') && github.repository == 'aristanetworks/anta'
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/codspeed.yml
  codecov:
    name: Upload coverage to codecov
    needs: [test-python]
    if: github.repository == 'aristanetworks/anta'
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/codecov.yml
