---
name: Testing ANTA
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  file-changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'anta/**'
              - 'tests/**'
              # detect dependency changes
              - 'pyproject.toml'
              - 'tox.toml'
              - 'uv.lock'
  test-python:
    name: Pytest across all supported python versions
    runs-on: ubuntu-latest
    env:
      COLUMNS: "165"
    strategy:
      matrix:
        include:
          - python: "3.10"
            tox_env: py310
          - python: "3.11"
            tox_env: py311
          - python: "3.12"
            tox_env: py312
          - python: "3.13"
            tox_env: py313
          - python: "3.14"
            tox_env: py314
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17" # renovate: uv
      - name: Install tox with its uv plugin
        run: uv sync --locked --only-group tox
      - name: Erase previous coverage data
        if: matrix.python == '3.11'
        run: uv run --no-sync tox run -e clean
      - name: "Run pytest with coverage for ${{ matrix.python }}"
        if: matrix.python == '3.11'
        run: uv run --no-sync tox run -e ${{ matrix.tox_env }}
      - name: "Run pytest for ${{ matrix.python }}"
        if: matrix.python != '3.11'
        run: uv run --no-sync tox run -e ${{ matrix.tox_env }} -- --no-cov
      - name: Generate coverage report
        if: matrix.python == '3.11'
        run: uv run --no-sync tox run -e report
      - name: Upload coverage from pytest
        # Coverage only runs as part of 3.11.
        if: |
          matrix.python == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-coverage
          path: coverage.xml
  test-python-windows:
    name: Pytest on 3.12 for windows
    runs-on: windows-2022
    needs: [file-changes]
    if: needs.file-changes.outputs.code == 'true'
    env:
      COLUMNS: "165"
      # Required to prevent asyncssh to fail.
      USERNAME: WindowsUser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12
      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17" # renovate: uv
      - name: Install tox with its uv plugin
        run: uv sync --locked --only-group tox
      - name: Run pytest for 3.12 on Windows
        run: uv run --no-sync tox run -e py312 -- --no-cov --ignore=tests/docs
  test-documentation:
    name: Build offline documentation for testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17" # renovate: uv
      - name: "Build Zensical documentation offline"
        run: uv run --locked --no-default-groups --group doc --extra cli zensical build --strict
  benchmarks:
    name: Benchmark ANTA for Python 3.12
    needs: [file-changes, test-python]
    if: needs.file-changes.outputs.code == 'true' && github.repository == 'aristanetworks/anta'
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/codspeed.yml
  codecov:
    name: Upload coverage to codecov
    needs: [test-python]
    if: github.repository == 'aristanetworks/anta'
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/codecov.yml
