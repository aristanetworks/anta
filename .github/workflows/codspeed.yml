---
name: Run benchmarks
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  benchmark-simulation:
    name: Benchmark ANTA for Python 3.12
    # TODO: Revisit ubuntu-26.04-arm when a CodSpeed upgrade supports automatic simulation setup.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Pin pip
        run: pip install "pip>=25.1"
      - name: Install dependencies
        run: pip install ".[cli]" --group test --group benchmark
      - name: Run benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: simulation
          run: pytest --codspeed --no-cov --log-cli-level INFO tests/benchmark

  benchmark-memory:
    name: Benchmark ANTA memory for Python 3.14
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Keep the qualified memory runtime explicit; see tests/benchmark/README.md.
          python-version: "3.14.9"
      - name: Pin pip
        run: pip install "pip>=25.1"
      - name: Install dependencies
        run: pip install ".[cli]" --group test --group benchmark
      - name: Run benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        env:
          PYTHONHASHSEED: "0"
        with:
          mode: memory
          runner-version: "5.5.0"
          run: pytest --codspeed --no-cov --log-cli-level INFO tests/benchmark/test_anta.py
