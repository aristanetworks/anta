---
# This is deploying the latest commits on main to main documentation
name: Zensical
on:
  push:
    branches:
      - main
    paths:
      # Run only if any of the following paths are changed when pushing to main
      - ".github/workflows/main-doc.yml"
      - "tools/zensical_extensions/**"
      - "docs/**"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
      - "anta/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  'build_latest_doc':
    name: 'Update Public main documentation'
    runs-on: ubuntu-latest
    concurrency:
      group: documentation-gh-pages
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 'Setup Python 3 on runner'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17" # renovate: uv

      - name: Setup Git config
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: 'Build Zensical content and deploy to gh-pages to main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          uv run --locked --no-default-groups --group doc docs/scripts/deploy_doc_version.sh main
