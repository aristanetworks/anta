[project.theme]
name = "zensical"
features = [
  "navigation.instant",
  "navigation.path",
  "navigation.top",
  "content.code.copy",
  "toc.follow",
  "navigation.indexes",
  "content.tabs.link",
]
favicon = "imgs/favicon.ico"
language = "en"
custom_dir = "docs/overrides"

[project.theme.icon]
repo = "fontawesome/brands/github"
logo = "fontawesome/solid/network-wired"

[project.theme.font]
code = "Fira Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "blue"
toggle = { icon = "material/weather-night", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "blue"
toggle = { icon = "material/weather-sunny", name = "Switch to light mode" }

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/aristanetworks/anta"

[[project.extra.social]]
icon = "fontawesome/brands/docker"
link = "https://github.com/aristanetworks/anta/pkgs/container/anta"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/anta/"

[project.extra.version]
provider = "mike"
default = ["stable"]

[project.plugins.mkdocstrings]
default_handler = "python"
custom_templates = "docs/templates"

[project.plugins.mkdocstrings.handlers.python]
inventories = [
  "https://docs.python.org/3/objects.inv",
  "https://mkdocstrings.github.io/objects.inv",
  "https://mkdocstrings.github.io/griffe/objects.inv",
]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
docstring_options = { ignore_init_summary = true }
docstring_section_style = "table"
heading_level = 2
inherited_members = false
merge_init_into_class = true
separate_signature = true
show_root_heading = true
show_root_full_path = false
show_signature_annotations = true
show_symbol_type_heading = true
show_symbol_type_toc = true
signature_crossrefs = true
filters = ["!^_"]
extensions = [
  { griffe_warnings_deprecated = { kind = "danger", title = "Deprecated" } },
]

[project.plugins.mike]
alias_type = "symlink"
deploy_prefix = ""
canonical_version = "stable"

[project.markdown_extensions]
admonition = {}
attr_list = {}
"_extensions.zensical_git_dates" = {}
"zensical.extensions.glightbox" = {}
codehilite.guess_lang = true
"pymdownx.arithmatex" = {}
"pymdownx.betterem".smart_enable = "all"
"pymdownx.caret" = {}
"pymdownx.critic" = {}
"pymdownx.details" = {}
"pymdownx.emoji".emoji_index = "zensical.extensions.emoji.twemoji"
"pymdownx.emoji".emoji_generator = "zensical.extensions.emoji.to_svg"
"pymdownx.highlight" = {}
"pymdownx.inlinehilite" = {}
"pymdownx.magiclink" = {}
"pymdownx.mark" = {}
"pymdownx.smartsymbols" = {}
"pymdownx.snippets".base_path = [".", "docs", "docs/snippets", "examples"]
"pymdownx.superfences".custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
"pymdownx.tabbed".alternate_style = true
"pymdownx.tasklist".custom_checkbox = true
"pymdownx.tilde" = {}
smarty = {}
toc.separator = "-"
toc.permalink = true
toc.baselevel = 2
