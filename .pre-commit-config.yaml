---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
files: ^(anta|docs|scripts|tests|asynceapi|tools|\.github)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: docs/.*.svg
      - id: end-of-file-fixer
      - id: check-added-large-files
        exclude: tests/data/.*$|docs/imgs/.*\.gif$
      - id: check-merge-conflict

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: ad1b27d73581aa16cca06fc4a0761fc563ffe8e8  # frozen: v1.5.6
    hooks:
      - name: Check and insert license on Python files
        id: insert-license
        # exclude:
        files: .*\.py$
        args:
          - --license-filepath
          - .github/license-short.txt
          - --use-current-year
          - --allow-past-years
          - --fuzzy-match-generates-todo
          - --no-extra-eol

      - name: Check and insert license on Markdown files
        id: insert-license
        files: .*\.md$
        exclude: ^(tests/data/.*\.md|\.github/pull_request_template\.md)$
        args:
          - --license-filepath
          - .github/license-short.txt
          - --use-current-year
          - --allow-past-years
          - --fuzzy-match-generates-todo
          - --detect-license-in-X-top-lines
          - "30"
          - --comment-style
          - "<!--|  ~|  -->"

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f368fb366ff7f2f808dd324b83a6d32267799e19  # frozen: v0.17.2
    hooks:
      - id: ruff
        name: Run Ruff linter
        args: [--fix]
      - id: ruff-format
        name: Run Ruff formatter

  - repo: https://github.com/pycqa/pylint
    rev: "8a396357098337ba8be714fffdf2d00947a9778c"  # frozen: v4.0.6
    hooks:
      - id: pylint
        name: Check code style with pylint
        description: This hook runs pylint.
        types: [python]
        language: python
        args:
          - -rn # Only display messages
          - -sn # Don't display the score
          - --rcfile=pyproject.toml # Link to config file
        additional_dependencies:
          - anta[cli]
          - types-PyYAML==6.0.12.20260906
          - types-requests==2.33.0.20261006
          - types-pyOpenSSL==24.1.0.20240722
          - pylint_pydantic==0.4.1
          - pytest==9.1.1
          - pytest-codspeed!=4.1.0
          - respx==0.23.1
          - pydantic-settings==2.16.1
          - zensical==0.0.71

  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell
        name: Checks for common misspellings in text files.
        entry: codespell
        language: python
        types: [text]
        args: ["--ignore-words", ".codespellignore"]

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: 1aa6dfeb849ae43fb6f16fc17228bcbd358a19c3  # frozen: v1.1.414
    hooks:
      - id: pyright
        name: PyRight static type checker
        types: [python]
        language: python
        additional_dependencies:
          - anta[cli]
          - pytest>=9.1.1
          - respx==0.23.1
          - pytest-httpx>=0.36.2
          - pytest-codspeed>=5.0.3
          - types-PyYAML==6.0.12.20260906
          - types-requests==2.33.0.20261006
          - types-pyOpenSSL==24.1.0.20240722
          - zensical==0.0.71
        files: ^(anta|tests|asynceapi|tools/zensical_extensions)/

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 341e2a331ba578029e66c2e01183e7a6b5ca9ab4  # frozen: v0.24.0
    hooks:
      - id: markdownlint-cli2
        name: Check for Linting errors on Markdown files.
        args:
          - --config
          - .github/.markdownlint-cli2.yaml

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f  # frozen: v1.31.1
    hooks:
      - id: zizmor
        name: Check GitHub Actions with zizmor
        files: ^\.github/
        pass_filenames: false
        args: ["--fix", ".github"]

  - repo: local
    hooks:
      - id: examples-test
        name: Generate examples/tests.yaml
        entry: >-
          sh -c "docs/scripts/generate_examples_tests.py"
        types: [python]
        files: anta/
        verbose: true
        pass_filenames: false
        language: python
        additional_dependencies:
          - anta[cli]
          - pydantic-settings==2.16.1
      - id: doc-snippets
        name: Generate doc snippets
        entry: >-
          sh -c "docs/scripts/generate_doc_snippets.py"
        language: python
        types: [python]
        files: ^anta/(cli|experimental/cli)/
        verbose: true
        pass_filenames: false
        additional_dependencies:
          - anta[cli]
          # Keep generated CLI snippets stable with Click's optional subcommand rendering.
          - click~=8.5.0
          - pydantic-settings==2.16.1
