################################
# Tox
# Not in pyproject.toml because: 
# https://github.com/mbarkhau/bumpver/issues/247
################################
requires = ["tox>=4.21"]
env_list = [
  "clean",
  "lint",
  "type",
  "py310",
  "py311",
  "py312",
  "py313",
  "py314",
  "py315",
  "report"
]

[env_run_base]
description = "Run pytest with {basepython}"
extras = ["cli"]
dependency_groups = ["test"]
# posargs allows to run only a specific test using tox -e <env> -- path/to/my/test::test
commands = [["pytest", { replace = "posargs", extend = true }]]
# To test on non-POSIX system
# https://github.com/tox-dev/tox/issues/1455
passenv = ["USERNAME"]
# New tox is breaking column width set in our tests..
set_env = { COLUMNS = "165"}

[env.lint]
description = "Check the code style"
dependency_groups = ["lint", "test", "benchmark"]
commands =[
  ["ruff", "check", "."],
  ["ruff", "format", ".", "--check"],
  ["pylint", "anta"],
  ["pylint", "tests"],
  ["pylint", "asynceapi"],
]

[env.type]
description = "Check typing"
dependency_groups = ["lint", "test", "benchmark"]
commands =[
  ["pyright", "anta"],
  ["pyright", "tests"],
  ["pyright", "asynceapi"],
]

[env.clean]
skip_install=true
dependency_groups = []
deps = ["coverage[toml]"]
description = "Clean existing coverage"
commands =[
  ["coverage", "erase"],
]

[env.report]
description = "Generate coverage report"
skip_install=true
dependency_groups = []
deps = ["coverage[toml]"]
commands = [
  ["coverage", "--version"],
  ["coverage", "html", "--rcfile=pyproject.toml"],
  ["coverage", "xml", "--rcfile=pyproject.toml"],
]
depends = ["py311"]
